spring:
  application:
    name: staffmentor-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staffmentor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

staffmentor:
  ai:
    provider: ${AI_PROVIDER:openai}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4.1-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/responses}
